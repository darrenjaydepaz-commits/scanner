<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotics NextGen Smart Classroom Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        body { background-color: #f8f9fa; color: #212529; }
        .attendance-container { background: white; padding: 2rem; border-radius: 0.5rem; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075); margin: 2rem auto; max-width: 1200px; }
        header { text-align: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid #dee2e6; }
        h1 { color: #495057; margin: 0; font-size: 2rem; font-weight: 600; }
        .controls { text-align: right; margin-bottom: 1.5rem; }
        .table-responsive { margin-bottom: 2rem; }
        table { margin-bottom: 0; }
        .num-col { width: 50px; text-align: center; font-weight: bold; }
        .footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #dee2e6; display: flex; align-items: center; }
        .teacher-input { border: none; border-bottom: 1px solid #ced4da; min-width: 250px; margin-left: 0.5rem; outline: none; padding: 0.25rem 0.5rem; background: transparent; }
        .teacher-input:focus { border-bottom: 1px solid #007bff; }
        td[contenteditable="true"] { background: #f8f9fa; }
        td[contenteditable="true"]:focus { outline: none; background: white; box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25); }
        td[contenteditable="false"] { cursor: not-allowed; color: #6c757d; }
        @media print { body { background: white; color: black; } .attendance-container { box-shadow: none; } .controls { display: none; } }
        /* QR modal styling */
        #qr-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; z-index:2000; }
        #qr-modal .modal-inner { background:white; padding:1rem; border-radius:8px; max-width:420px; margin:auto; text-align:center; }
    </style>
</head>
<body>

<div class="container attendance-container">
    <header>
        <img src="https://icon2.cleanpng.com/lnd/20250227/ol/78370c7ebb42c577144019bd42a156.webp" alt="DepEd Logo" class="img-fluid mb-3" style="max-width: 150px; background: white;">
        <h1>Schools Division Office of Olongapo City</h1>
        <div class="mb-2">NEXTGEN SMART CLASSROOM</div>
    </header>

    <div class="mb-3">
        <label for="school-name" class="form-label">School Name:</label>
        <input type="text" id="school-name" class="form-control" placeholder="Enter school name">
    </div>

    <div class="controls">
        <button class="btn btn-outline-secondary me-2" onclick="unlockCells()">🔓 Unlock for Editing</button>
        <button class="btn btn-outline-info me-2" onclick="alert('Button Works'); startQRInput();">
    📥 Input (Scan QR)
</button>
        <button class="btn btn-outline-primary me-2" onclick="downloadCSV()">📄 Download CSV</button>
        <button class="btn btn-outline-success" onclick="downloadExcel()">📊 Download Excel</button>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered">
            <thead class="table-light">
                <tr>
                   <th class="num-col">PC Number</th>
                    <th>Full Name</th>
                    <th>Grade</th>
                    <th>School</th>
                    <th>Pre Test</th>
                    <th>Post Test</th>
                    <th>Feedback</th>
                    
                </tr>
            </thead>
            <tbody id="attendance-body">
                <!-- Rows generated by JS -->
            </tbody>
        </table>
    </div>

    <div class="footer">
        <label class="form-label mb-0 me-2">Name of Teacher:</label>
        <span class="teacher-input" id="teacher-name" contenteditable="true" onblur="saveTeacher()"></span>
    </div>
</div>

<!-- QR Scanner Modal -->
<div id="qr-modal">
    <div class="modal-inner">
        <h5>Scan QR Code</h5>
        <div id="qr-reader" style="width:360px;margin:0 auto;"></div>
        <div class="mt-2">
            <button class="btn btn-sm btn-secondary me-2" onclick="stopQRInput()">Cancel</button>
        </div>
    </div>
</div>

<!-- Preview modal for parsed QR data -->
<div id="qr-preview" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;z-index:2100;">
    <div style="background:white;padding:1rem;border-radius:8px;max-width:420px;margin:auto;">
        <h5>Preview scanned data</h5>
        <div id="qr-preview-content" style="text-align:left;margin-top:0.5rem;font-size:0.95rem;"></div>
        <div class="mt-2 text-end">
            <button class="btn btn-sm btn-secondary me-2" onclick="closePreview()">Cancel</button>
            <button class="btn btn-sm btn-primary" onclick="insertPreview()">Insert</button>
        </div>
    </div>
</div>

<script>
const tbody = document.getElementById('attendance-body');

const PASS = "1234";

const NEXTGEN_ATTENDANCE_KEY = 'nextgen_attendanceData';
const NEXTGEN_TEACHER_KEY = 'nextgen_teacherName';
const NEXTGEN_SCHOOL_KEY = 'nextgen_schoolName';

let html5Scanner = null;
let lastParsedQR = null;


/* =========================================================
   INITIALIZE 40 ROWS
========================================================= */

for (let i = 1; i <= 40; i++) {

    const row = document.createElement('tr');

    row.innerHTML = `
        <td class="num-col">${i}</td>

        <td contenteditable="true"
            onblur="lockCell(this)"></td>

        <td contenteditable="true"
            onblur="lockCell(this)"></td>

        <td contenteditable="true"
            onblur="lockCell(this)"></td>

        <td contenteditable="true"
            onblur="lockCell(this)"></td>

        <td contenteditable="true"
            onblur="lockCell(this)"></td>

        <td contenteditable="true"
            onblur="lockCell(this)"></td>
    `;

    tbody.appendChild(row);
}


/* =========================================================
   SCHOOL NAME STORAGE
========================================================= */

const schoolInput = document.getElementById('school-name');

schoolInput.addEventListener('input', function () {
    localStorage.setItem(
        NEXTGEN_SCHOOL_KEY,
        this.value
    );
});

function loadSchoolName() {

    schoolInput.value =
        localStorage.getItem(NEXTGEN_SCHOOL_KEY) || '';
}


/* =========================================================
   ATTENDANCE STORAGE
========================================================= */

function saveAttendance() {

    const data = [];

    const rows = tbody.querySelectorAll('tr');

    rows.forEach(row => {

        const cells =
            row.querySelectorAll('td:not(.num-col)');

        const pcnumber =
            row.querySelector('.num-col').innerText.trim();

        data.push({
            pcnumber: pcnumber,
            name: cells[0].innerText.trim(),
            grade: cells[1].innerText.trim(),
            school: cells[2].innerText.trim(),
            preTest: cells[3].innerText.trim(),
            postTest: cells[4].innerText.trim(),
            feedback: cells[5].innerText.trim()
        });
    });

    localStorage.setItem(
        NEXTGEN_ATTENDANCE_KEY,
        JSON.stringify(data)
    );
}


/* =========================================================
   LOAD ATTENDANCE
========================================================= */

function loadAttendance() {

    let data = [];

    try {

        data = JSON.parse(
            localStorage.getItem(
                NEXTGEN_ATTENDANCE_KEY
            ) || '[]'
        );

    } catch (error) {

        console.error(
            "Could not load attendance:",
            error
        );

        data = [];
    }

    const rows = tbody.querySelectorAll('tr');

    rows.forEach((row, index) => {

        if (!data[index]) return;

        const cells =
            row.querySelectorAll('td:not(.num-col)');

        /*
         * Restore PC number.
         */
        if (data[index].pcnumber) {

            row.querySelector('.num-col').innerText =
                data[index].pcnumber;
        }

        cells[0].innerText =
            data[index].name || '';

        cells[1].innerText =
            data[index].grade || '';

        cells[2].innerText =
            data[index].school || '';

        cells[3].innerText =
            data[index].preTest || '';

        cells[4].innerText =
            data[index].postTest || '';

        cells[5].innerText =
            data[index].feedback || '';


        /*
         * Lock cells that already contain data.
         */
        cells.forEach(cell => {

            if (cell.innerText.trim() !== '') {

                cell.contentEditable = 'false';

            } else {

                cell.contentEditable = 'true';

            }
        });

    });
}


/* =========================================================
   TEACHER STORAGE
========================================================= */

function saveTeacher() {

    const teacher =
        document.getElementById(
            'teacher-name'
        ).innerText.trim();

    localStorage.setItem(
        NEXTGEN_TEACHER_KEY,
        teacher
    );
}


function loadTeacher() {

    const teacher =
        localStorage.getItem(
            NEXTGEN_TEACHER_KEY
        ) || '';

    document.getElementById(
        'teacher-name'
    ).innerText = teacher;
}


/* =========================================================
   LOCK CELL AFTER EDITING
========================================================= */

function lockCell(cell) {

    if (cell.innerText.trim() !== '') {

        cell.contentEditable = 'false';

    }

    saveAttendance();
}


/* =========================================================
   UNLOCK CELLS
========================================================= */

function unlockCells() {

    const pw =
        prompt("Enter password to unlock cells:");

    if (pw !== PASS) {

        alert("Incorrect password. Access denied.");

        return;
    }

    const cells =
        document.querySelectorAll(
            'td[contenteditable="false"], .teacher-input'
        );

    cells.forEach(cell => {

        cell.contentEditable = 'true';

    });

    alert(
        "Editing enabled. Cells will re-lock when you finish typing."
    );
}


/* =========================================================
   CSV EXPORT
========================================================= */

function downloadCSV() {

    Swal.fire({

        title: 'Confirm Download',

        text:
            'Download attendance data as CSV? ' +
            'Data will be cleared after download.',

        icon: 'question',

        showCancelButton: true,

        confirmButtonText: 'Download',

        cancelButtonText: 'Cancel'

    }).then(result => {

        if (!result.isConfirmed) return;

        const csv = generateCSV();

        const blob =
            new Blob(
                [csv],
                { type: 'text/csv;charset=utf-8;' }
            );

        const url =
            URL.createObjectURL(blob);

        const a =
            document.createElement('a');

        a.href = url;

        const schoolName =
            schoolInput.value.trim() ||
            'attendance';

        a.download =
            sanitizeFilename(schoolName) +
            '.csv';

        document.body.appendChild(a);

        a.click();

        document.body.removeChild(a);

        URL.revokeObjectURL(url);

        clearStoredData();

        Swal.fire(
            'Data Cleared',
            'NextGen attendance data has been cleared from storage.',
            'info'
        ).then(() => {

            location.reload();

        });

    });
}


/* =========================================================
   GENERATE CSV
========================================================= */

function generateCSV() {

    let csv =
        'PC Number,Name,Grade,School,Pre Test,Post Test,Feedback\n';

    const rows =
        tbody.querySelectorAll('tr');

    rows.forEach(row => {

        const cells =
            row.querySelectorAll(
                'td:not(.num-col)'
            );

        const pcnumber =
            row.querySelector(
                '.num-col'
            ).innerText.trim();

        const name =
            cells[0].innerText.trim();

        const grade =
            cells[1].innerText.trim();

        const school =
            cells[2].innerText.trim();

        const preTest =
            cells[3].innerText.trim();

        const postTest =
            cells[4].innerText.trim();

        const feedback =
            cells[5].innerText.trim();

        csv += [
            csvEscape(pcnumber),
            csvEscape(name),
            csvEscape(grade),
            csvEscape(school),
            csvEscape(preTest),
            csvEscape(postTest),
            csvEscape(feedback)
        ].join(',');

        csv += '\n';
    });

    csv += '\n';

    csv +=
        csvEscape('Teacher') +
        ',' +
        csvEscape(
            document.getElementById(
                'teacher-name'
            ).innerText.trim()
        ) +
        '\n';

    return csv;
}


/* =========================================================
   CSV ESCAPE
========================================================= */

function csvEscape(value) {

    return '"' +
        String(value || '')
            .replace(/"/g, '""') +
        '"';
}


/* =========================================================
   EXCEL EXPORT
========================================================= */

function downloadExcel() {

    const data = [];

    data.push([
        'PC Number',
        'Name',
        'Grade',
        'School',
        'Pre Test',
        'Post Test',
        'Feedback'
    ]);

    const rows =
        tbody.querySelectorAll('tr');

    rows.forEach(row => {

        const cells =
            row.querySelectorAll(
                'td:not(.num-col)'
            );

        const pcnumber =
            row.querySelector(
                '.num-col'
            ).innerText.trim();

        data.push([
            pcnumber,
            cells[0].innerText.trim(),
            cells[1].innerText.trim(),
            cells[2].innerText.trim(),
            cells[3].innerText.trim(),
            cells[4].innerText.trim(),
            cells[5].innerText.trim()
        ]);

    });


    data.push([]);

    data.push([
        'Teacher',
        document.getElementById(
            'teacher-name'
        ).innerText.trim()
    ]);

    data.push([
        'School',
        schoolInput.value.trim()
    ]);


    const ws =
        XLSX.utils.aoa_to_sheet(data);

    const wb =
        XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        wb,
        ws,
        'Attendance'
    );


    const schoolName =
        schoolInput.value.trim() ||
        'attendance';

    XLSX.writeFile(
        wb,
        sanitizeFilename(schoolName) +
        '.xlsx'
    );


    clearStoredData();

    Swal.fire(
        'Data Cleared',
        'NextGen attendance data has been cleared from storage.',
        'info'
    ).then(() => {

        location.reload();

    });
}


/* =========================================================
   CLEAR STORAGE
========================================================= */

function clearStoredData() {

    localStorage.removeItem(
        NEXTGEN_ATTENDANCE_KEY
    );

    localStorage.removeItem(
        NEXTGEN_TEACHER_KEY
    );

    localStorage.removeItem(
        NEXTGEN_SCHOOL_KEY
    );
}


/* =========================================================
   SAFE FILE NAME
========================================================= */

function sanitizeFilename(name) {

    return String(name)
        .replace(/[<>:"/\\|?*]/g, '_')
        .trim() || 'attendance';
}


/* =========================================================
   CAMERA TEST
========================================================= */

function testCamera() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        alert(
            "Camera access is not supported by this browser."
        );

        return;
    }

    navigator.mediaDevices
        .getUserMedia({ video: true })

        .then(stream => {

            stream
                .getTracks()
                .forEach(track => track.stop());

            alert(
                "Camera access granted!"
            );

        })

        .catch(error => {

            console.error(error);

            alert(
                "Camera error: " +
                error.message
            );

        });
}


/* =========================================================
   QR SCANNER
========================================================= */

async function startQRInput() {

    document.getElementById(
        "qr-modal"
    ).style.display = "flex";


    try {

        if (html5Scanner) {

            return;
        }


        /*
         * Clear old scanner container.
         */
        document.getElementById(
            "qr-reader"
        ).innerHTML = "";


        html5Scanner =
            new Html5Qrcode(
                "qr-reader"
            );


        const cameras =
            await Html5Qrcode.getCameras();


        if (
            !cameras ||
            cameras.length === 0
        ) {

            throw new Error(
                "No camera found."
            );
        }


        /*
         * Prefer rear camera.
         */
        let cameraId =
            cameras[0].id;


        const rearCamera =
            cameras.find(camera => {

                const label =
                    (
                        camera.label ||
                        ''
                    ).toLowerCase();

                return (
                    label.includes('back') ||
                    label.includes('rear') ||
                    label.includes('environment')
                );

            });


        if (rearCamera) {

            cameraId =
                rearCamera.id;
        }


        await html5Scanner.start(

            cameraId,

            {
                fps: 10,

                qrbox: {
                    width: 280,
                    height: 280
                }
            },

            qrCodeSuccessCallback,

            () => {
                /*
                 * Ignore continuous scan errors.
                 */
            }

        );

    }

    catch (error) {

        console.error(
            "QR scanner error:",
            error
        );

        Swal.fire({

            icon: "error",

            title: "Camera Error",

            text:
                error.message ||
                "Unable to start camera."

        });

        await stopQRInput();
    }
}


/* =========================================================
   STOP QR SCANNER
========================================================= */

async function stopQRInput() {

    document.getElementById(
        "qr-modal"
    ).style.display = "none";


    try {

        if (html5Scanner) {

            await html5Scanner.stop();

            await html5Scanner.clear();

        }

    }

    catch (error) {

        console.error(
            "Error stopping scanner:",
            error
        );

    }

    finally {

        html5Scanner = null;

        document.getElementById(
            "qr-reader"
        ).innerHTML = "";

    }
}


/* =========================================================
   QR SUCCESS
========================================================= */

async function qrCodeSuccessCallback(
    decodedText
) {

    console.log(
        "SCANNED:",
        decodedText
    );


    /*
     * Stop scanner immediately so the
     * same QR code is not scanned repeatedly.
     */
    await stopQRInput();


    processQRData(decodedText);
}


/* =========================================================
   PROCESS QR DATA
========================================================= */

function processQRData(text) {

    let obj;


    try {

        obj =
            JSON.parse(text);

    }

    catch (error) {

        Swal.fire(
            "Invalid QR",
            "QR content is not valid JSON.",
            "warning"
        );

        return;
    }


    const parsed = {

        pcnumber:
            obj.pcnumber ??
            obj.pcNumber ??
            obj.PCNumber ??
            "",

        name:
            obj.fullname ??
            obj.fullName ??
            obj.name ??
            "",

        grade:
            obj.grade ??
            obj.Grade ??
            "",

        school:
            obj.school ??
            obj.School ??
            "",

        preTest:
            obj.pretest ??
            obj.preTest ??
            obj.PreTest ??
            "",

        postTest:
            obj.posttest ??
            obj.postTest ??
            obj.PostTest ??
            "",

        feedback:
            obj.feedback ??
            obj.Feedback ??
            ""

    };


    /*
     * Clean values.
     */
    Object.keys(parsed).forEach(key => {

        parsed[key] =
            String(
                parsed[key] ?? ''
            ).trim();

    });


    if (!parsed.name) {

        Swal.fire(
            "Invalid QR",
            "Name not found in QR.",
            "warning"
        );

        return;
    }


    showPreview(parsed);
}


/* =========================================================
   SHOW QR PREVIEW
========================================================= */

function showPreview(data) {

    lastParsedQR = data;


    document.getElementById(
        "qr-preview-content"
    ).innerHTML = `

        <div>
            <b>PC Number:</b>
            ${escapeHtml(data.pcnumber)}
        </div>

        <div>
            <b>Name:</b>
            ${escapeHtml(data.name)}
        </div>

        <div>
            <b>Grade:</b>
            ${escapeHtml(data.grade)}
        </div>

        <div>
            <b>School:</b>
            ${escapeHtml(data.school)}
        </div>

        <div>
            <b>Pre-Test:</b>
            ${escapeHtml(data.preTest)}
        </div>

        <div>
            <b>Post-Test:</b>
            ${escapeHtml(data.postTest)}
        </div>

        <div>
            <b>Feedback:</b>
            ${escapeHtml(data.feedback)}
        </div>

    `;


    document.getElementById(
        "qr-preview"
    ).style.display = "flex";
}


/* =========================================================
   CLOSE PREVIEW
========================================================= */

function closePreview() {

    document.getElementById(
        'qr-preview'
    ).style.display = 'none';

    lastParsedQR = null;
}


/* =========================================================
   INSERT PREVIEW
========================================================= */

function insertPreview() {

    if (!lastParsedQR) {

        closePreview();

        return;
    }


    insertParsed(
        lastParsedQR
    );
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value || '')
        .replace(
            /[&<>"']/g,
            function (character) {

                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'

                }[character];

            }
        );
}


/* =========================================================
   INSERT QR DATA INTO ATTENDANCE TABLE
========================================================= */

function insertParsed(parsed) {

    /*
     * Validate PC number.
     */
    const pc =
        Number(
            String(
                parsed.pcnumber
            ).trim()
        );


    if (
        !Number.isInteger(pc) ||
        pc < 1 ||
        pc > 40
    ) {

        Swal.fire(
            "Invalid PC Number",
            "PC Number must be a whole number between 1 and 40.",
            "warning"
        );

        return;
    }


    const rows =
        tbody.querySelectorAll('tr');


    const row =
        rows[pc - 1];


    if (!row) {

        Swal.fire(
            "Error",
            "The selected PC row could not be found.",
            "error"
        );

        return;
    }


    const cells =
        row.querySelectorAll(
            'td:not(.num-col)'
        );


    const wasAlreadyFilled =
        cells[0].innerText.trim() !== '';


    /*
     * Insert values.
     *
     * Only values supplied by the QR code
     * will replace existing values.
     */
    if (parsed.name) {

        cells[0].innerText =
            parsed.name;
    }

    if (parsed.grade) {

        cells[1].innerText =
            parsed.grade;
    }

    if (parsed.school) {

        cells[2].innerText =
            parsed.school;
    }

    if (parsed.preTest) {

        cells[3].innerText =
            parsed.preTest;
    }

    if (parsed.postTest) {

        cells[4].innerText =
            parsed.postTest;
    }

    if (parsed.feedback) {

        cells[5].innerText =
            parsed.feedback;
    }


    /*
     * Lock populated cells after QR insertion.
     */
    cells.forEach(cell => {

        if (cell.innerText.trim() !== '') {

            cell.contentEditable =
                'false';

        }

    });


    /*
     * Save everything.
     */
    saveAttendance();


    /*
     * Automatically save school from QR
     * if the school-name field is empty.
     */
    if (
        parsed.school &&
        !schoolInput.value.trim()
    ) {

        schoolInput.value =
            parsed.school;

        localStorage.setItem(
            NEXTGEN_SCHOOL_KEY,
            parsed.school
        );
    }


    closePreview();


    Swal.fire({

        icon: "success",

        title:
            wasAlreadyFilled
                ? "Updated"
                : "Successfully Inserted",

        text:
            `PC ${pc} attendance was ` +
            `${
                wasAlreadyFilled
                    ? "updated"
                    : "inserted"
            } successfully.`,

        confirmButtonText: "OK"

    });
}


/* =========================================================
   LOAD SAVED DATA WHEN PAGE OPENS
========================================================= */

loadAttendance();

loadTeacher();

loadSchoolName();


/* =========================================================
   OPTIONAL: SAVE SCHOOL WHEN USER LEAVES FIELD
========================================================= */
